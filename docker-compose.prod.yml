services:
  postgres:
    image: postgres:16-alpine
    container_name: kiezwerk-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - db-net

  app:
    image: ghcr.io/33slueck/kiezwerk:latest
    container_name: kiezwerk-app
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-5242880}
      - REQUIRE_ADMIN_AUTH=${REQUIRE_ADMIN_AUTH:-true}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - RUN_DB_SEED=${RUN_DB_SEED:-false}
      - RUN_DB_ACCEPT_DATA_LOSS=${RUN_DB_ACCEPT_DATA_LOSS:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - web-proxy
      - db-net

volumes:
  postgres_data:
  uploads_data:

networks:
  web-proxy:
    name: web-proxy
    external: true
  db-net:
    name: kiezwerk-db-net
    internal: true
