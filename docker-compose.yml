services:
  postgres:
    image: postgres:16-alpine
    container_name: kiezwerk-berlin-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-KiezWerk Berlin}
    container_name: kiezwerk-berlin-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER is required}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-5242880}
      - REQUIRE_ADMIN_AUTH=${REQUIRE_ADMIN_AUTH:-true}
      - NEXTAUTH_URL=http://localhost:${KIEZWERK_HOST_PORT:-3002}
      - 'AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required — generate with: openssl rand -base64 32}'
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-demo.admin@kiezwerk.example}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-DemoAdmin123!}
      - NEXT_PUBLIC_SITE_URL=http://localhost:${KIEZWERK_HOST_PORT:-3002}
      - NEXT_PUBLIC_SITE_NAME=KiezWerk Berlin
      - RUN_DB_SEED=${RUN_DB_SEED:-true}
      - RUN_DB_ACCEPT_DATA_LOSS=${RUN_DB_ACCEPT_DATA_LOSS:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web-proxy
      - db-net

volumes:
  postgres_data:
  uploads_data:

networks:
  web-proxy:
    name: web-proxy
    external: true
  db-net:
    name: kiezwerk-db-net
    internal: true
